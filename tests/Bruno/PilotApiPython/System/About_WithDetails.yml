info:
  name: About_WithDetails
  type: http
  seq: 3

http:
  method: GET
  url: "{{Host}}about?show-details=true"
  params:
    - name: show-details
      value: "true"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return object", function () {
          const resBody = res.getBody();
          
          expect(resBody).to.have.property("apiVersion");
          expect(resBody).to.have.property("buildVersion");
          expect(resBody).to.have.property("deployDate");
          expect(resBody).to.have.property("name");
          expect(resBody.name).to.contain("PilotApi");

          expect(resBody).to.have.property("applicationConfiguration");
          const configuration = resBody?.applicationConfiguration;
          expect(configuration).to.have.property("dataSources");
          const dataSource = configuration?.dataSources[0];
          expect(dataSource).to.have.property("dataSourceEnum");
          expect(dataSource).to.have.property("dataSourceName");
          expect(dataSource).to.have.property("dataSourceType");

          expect(configuration).to.have.property("dataConnections");
          const dataConnection = configuration?.dataConnections[0];
          expect(dataConnection).to.have.property("connectTimeout");
          expect(dataConnection).to.have.property("dataSourceName");
          expect(dataConnection.dataSourceName).to.equal(dataSource.dataSourceName);
          expect(dataConnection).to.have.property("host");
          expect(dataConnection).to.have.property("port");
          expect(dataConnection).to.not.have.property("userName");
          expect(dataConnection).to.not.have.property("password");

          expect(configuration).to.have.property("security");
          const security = configuration?.security;
          expect(security).to.have.property("baseUrl");
          expect(security).to.have.property("realm");
          expect(security).to.have.property("clientId");
          expect(security).to.have.property("authority");

          expect(configuration).to.have.property("openTelemetry");
          const openTelemetry = configuration?.openTelemetry;
          expect(openTelemetry).to.have.property("server");
          expect(openTelemetry).to.have.property("port");

          expect(configuration).to.have.property("openApi");
          const openapi = configuration?.openApi;
          expect(openapi).to.have.property("summary");
          expect(openapi).to.have.property("version");
          expect(openapi).to.have.property("license");
          // expect(openapi.license).to.equal("MIT");
          expect(openapi).to.have.property("title");
          expect(openapi.title).to.contain("PilotApi");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
