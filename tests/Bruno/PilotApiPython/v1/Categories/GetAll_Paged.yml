info:
  name: GetAll_Paged
  type: http
  seq: 2

http:
  method: GET
  url: "{{Host}}v{{version}}/{{controller}}/get-all?page=1&pageSize=3"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "3"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return array", function () {
          const resBody = res.getBody();
          
          expect(resBody).to.be.an("array");
          expect(resBody).to.have.lengthOf(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
