info:
  name: GetAll_CorrelationIdTooLong
  type: http
  seq: 8

http:
  method: GET
  url: "{{Host}}v{{version}}/{{controller}}/get-all"
  headers:
    - name: X-Correlation-Id
      value: 7ea2c7f7-8b46-475d-86f8-7aaaa9e4a35b-too-long
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return bad request", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("should identify the invalid value", function () {
          const resBody = res.getBody();

          expect(resBody).to.have.property("title", "Bad Request");
          expect(resBody.detail).to.include("header.X-Correlation-Id: ");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
