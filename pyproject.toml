[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pilot-api-python"
version = "1.0.0"
description = "OpenAPI-driven FastAPI implementation for the Pilot API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "PilotApi Team" }
]
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "sqlalchemy>=2.0.43,<3.0.0",
  "alembic>=1.16.0,<2.0.0",
  "pyodbc>=5.2.0,<6.0.0",
  "psycopg[binary]>=3.2.1,<4.0.0",
  "python-json-logger>=2.0.7,<3.0.0",
  "pyjwt[crypto]>=2.9.0,<3.0.0",
  "opentelemetry-api>=1.44.0,<2.0.0",
  "opentelemetry-sdk>=1.44.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
  "opentelemetry-instrumentation-logging>=0.65b0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-cov>=6.2.0,<7.0.0",
  "httpx>=0.28.0,<1.0.0",
  "ruff>=0.12.0,<1.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pilot_api"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
